[gcode_macro SM_PRINT_AUTO_FEED_UNLESS_TPU]
description: Skip U1 automatic feed for manually loaded TPU on the mapped physical tool
gcode:
    {% set extruder = params.EXTRUDER | default(-1) | int %}
    {% set max_extruders = printer.configfile.settings.printer.max_physical_extruder_num | int %}
    {% set filament_types = printer.print_task_config.filament_type | default([]) %}
    {% if extruder < 0 or extruder >= max_extruders %}
        RESPOND TYPE=error MSG="TPU feed guard: invalid physical tool T{extruder}"
    {% elif extruder >= filament_types | length %}
        RESPOND TYPE=error MSG="TPU feed guard: no filament metadata for physical tool T{extruder}"
    {% elif "TPU" in filament_types[extruder] | upper %}
        RESPOND TYPE=echo MSG="TPU feed guard: skipping automatic feed for manually loaded TPU on physical T{extruder}"
    {% else %}
        SM_PRINT_AUTO_FEED EXTRUDER={extruder}
    {% endif %}
